# Uploads the site to laurenhallden.com/therapycalculator/ whenever main changes,
# then clears Cloudflare's copy of the changed files so the new versions show up right away.
# The secrets it uses are listed in UPDATING.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload the site over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          # The server's public key, so we only ever send the password to the real server
          SERVER_KEY: ssh-rsa 
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh
          echo "[$FTP_SERVER]:2222 $SERVER_KEY" >> ~/.ssh/known_hosts
          # The server only offers the older ssh-rsa key type, which newer SSH turns off by default
          lftp -c "
            set sftp:connect-program 'ssh -a -x -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o StrictHostKeyChecking=yes';
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            open --env-password -u \"$FTP_USERNAME\" -p 2222 \"sftp://$FTP_SERVER\";
            mirror --reverse --verbose \
              --exclude '^\.git' \
              --exclude '^\.github/' \
              --exclude '^\.sass-cache/' \
              --exclude '^sass/' \
              --exclude '^test/' \
              --exclude '(^|/)\.DS_Store$' \
              --exclude '^(package\.json|README\.md|UPDATING\.md)$' \
              ./ \"$FTP_PATH\"
          "

      - name: Clear Cloudflare's cache of the changed files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BEFORE: ${{ github.event.before }}
        run: |
          site=https://laurenhallden.com/therapycalculator
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
          else
            changed=$(git ls-files)
          fi
          urls=$( (echo "$site/"; echo "$changed" | sed "s|^|$site/|") | jq -R . | jq -sc .)
          # Cloudflare takes at most 30 URLs per purge; past that, clear the whole site
          if [ "$(echo "$urls" | jq length)" -gt 30 ]; then
            body='{"purge_everything":true}'
          else
            body=$(jq -nc --argjson files "$urls" '{files: $files}')
          fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body"
